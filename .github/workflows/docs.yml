# main と v で始まるブランチを GitHub Pages にまとめて出す。
# pages タスクのあるブランチは動く OS を <ブランチ>/ に、API ドキュメントを api/<ブランチ>/ に、
# 既定の提供リストを apps/<ブランチ>/ に出す（どちらも OS の Service Worker の範囲の外）。
# それ以外のブランチは API ドキュメントを <ブランチ>/ に出す。
# どのブランチから動いても全ブランチを作り直すので、ほかのブランチの分は消えない。
name: Docs

on:
  push:
    branches: [main, "v*"]
  delete:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # ブランチの削除では main の workflow が動く。Pages に載せない PR のブランチを消したときは作り直さない
    if: github.event_name != 'delete' || github.event.ref == 'main' || startsWith(github.event.ref, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # main がまだ v0.1（npm と TypeDoc）なので、その API ドキュメントを作るのに Node が要る。
      # v0.2 を main に入れたら、この setup-node と下の typedoc.json の分岐は消す
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.7
      - name: Build docs for each branch
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          links=""
          for branch in $(git for-each-ref --format='%(refname:lstrip=3)' refs/remotes/origin | grep -E '^(main|v.*)$' | sort -r); do
            dir="$RUNNER_TEMP/src/$branch"
            git worktree add --detach "$dir" "origin/$branch"
            if [ -f "$dir/typedoc.json" ]; then
              (cd "$dir" && npm ci && npm run docs -- --out "$RUNNER_TEMP/site/$branch")
              label="$branch"
              [ "$branch" = main ] && label="main（現行）"
              links="$links<li><a href=\"./$branch/\">$label</a></li>"
            elif [ -f "$dir/deno.json" ]; then
              (
                cd "$dir"
                if grep -q '"pages":' deno.json; then
                  BINETTE_PAGES_OUT="$RUNNER_TEMP/site/$branch" BINETTE_PAGES_API_OUT="$RUNNER_TEMP/site/api/$branch" \
                    BINETTE_PAGES_APPS_OUT="$RUNNER_TEMP/site/apps/$branch" BINETTE_PAGES_BRANCH="$branch" deno task pages
                elif [ -f _config.ts ]; then
                  BINETTE_DOCS_OUT="$RUNNER_TEMP/site/$branch" BINETTE_DOCS_BRANCH="$branch" deno task docs
                else
                  entries=(packages/core/src/index.ts packages/regie/src/index.ts packages/scene/src/index.ts packages/coulisses/src/index.ts)
                  [ ! -f packages/decor/src/index.ts ] || entries+=(packages/decor/src/index.ts)
                  [ ! -f packages/regie/src/build.ts ] || entries+=(packages/regie/src/build.ts)
                  [ ! -f packages/regie/src/cli.ts ] || entries+=(packages/regie/src/cli.ts)
                  deno doc --html --name=Binette --output="$RUNNER_TEMP/site/$branch" "${entries[@]}"
                fi
              )
              label="$branch"
              [ "$branch" = main ] && label="main（現行）"
              if grep -q '"pages":' "$dir/deno.json" 2>/dev/null; then
                apps=""
                [ ! -f "$RUNNER_TEMP/site/apps/$branch/apps.json" ] || apps=" · <a href=\"./apps/$branch/\">提供リスト</a>"
                links="$links<li><a href=\"./$branch/\">$label（Binette を開く）</a> · <a href=\"./api/$branch/\">API</a>$apps</li>"
              else
                links="$links<li><a href=\"./$branch/\">$label（API ドキュメント）</a></li>"
              fi
            fi
          done
          cat > "$RUNNER_TEMP/site/index.html" <<HTML
          <!doctype html>
          <html lang="ja">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Binette</title>
          <style>
          :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
          body { max-width: 40rem; margin: 0 auto; padding: 2rem 1rem; line-height: 1.6; }
          li { margin: .5rem 0; }
          a { display: inline-block; min-height: 44px; line-height: 44px; }
          </style>
          </head>
          <body>
          <h1>Binette</h1>
          <p>ブランチごとの Binette と API ドキュメントです。v0.2 からは、仕様書は Binette の中の「ドキュメント」アプリで読めます。</p>
          <ul>$links</ul>
          <p><a href="https://github.com/nozomi-hiragi/binette">GitHub</a></p>
          </body>
          </html>
          HTML
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
