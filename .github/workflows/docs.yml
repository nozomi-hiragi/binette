# main と v で始まるブランチを GitHub Pages にまとめて出す。
# 直下に紹介ページ（landing/）、main の動く OS を live/ に、
# 全ブランチの API ドキュメントを docs/api/<ブランチ>/ に、ドキュメントの入口を docs/ に出す。
# 開発中のブランチの OS は出さない。同じオリジンの OS は保存領域と Service Worker のキャッシュを共有するので、
# カーネルの版が違う OS を並べると互いに壊す。
# （API ドキュメントは OS の Service Worker の範囲の外）。
# どのブランチから動いても全ブランチを作り直すので、ほかのブランチの分は消えない。
name: Docs

on:
  push:
    branches: [main, "v*"]
  delete:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # 作り直さない削除（PR のブランチ）は別の組にする。同じ組だと、何もしない実行が動いている作り直しを取り消してしまう
  group: ${{ github.event_name == 'delete' && github.event.ref != 'main' && !startsWith(github.event.ref, 'v') && format('pages-skip-{0}', github.run_id) || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    # ブランチの削除では main の workflow が動く。Pages に載せない PR のブランチを消したときは作り直さない
    if: github.event_name != 'delete' || github.event.ref == 'main' || startsWith(github.event.ref, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # main がまだ v0.1（npm と TypeDoc）なので、その API ドキュメントを作るのに Node が要る。
      # v0.2 を main に入れたら、この setup-node と下の typedoc.json の分岐は消す
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.7
      - name: Build docs for each branch
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          doc_links=""
          for branch in $(git for-each-ref --format='%(refname:lstrip=3)' refs/remotes/origin | grep -E '^(main|v.*)$' | sort -r); do
            dir="$RUNNER_TEMP/src/$branch"
            git worktree add --detach "$dir" "origin/$branch"
            if [ -f "$dir/typedoc.json" ]; then
              mkdir -p "$RUNNER_TEMP/site/docs/api/$branch"
              (cd "$dir" && npm ci && npm run docs -- --out "$RUNNER_TEMP/site/docs/api/$branch")
            elif [ -f "$dir/deno.json" ]; then
              (
                cd "$dir"
                if grep -q '"pages":' deno.json && [ "$branch" = main ]; then
                  BINETTE_PAGES_OUT="$RUNNER_TEMP/site/live" BINETTE_PAGES_API_OUT="$RUNNER_TEMP/site/docs/api/$branch" \
                    BINETTE_PAGES_BRANCH="$branch" deno task pages
                elif grep -q '"pages":' deno.json; then
                  # 開発中のブランチは API ドキュメントだけ作る
                  BINETTE_API_OUT="$RUNNER_TEMP/site/docs/api/$branch" \
                    deno eval 'const { api } = await import("./scripts/docs.ts"); await api(Deno.env.get("BINETTE_API_OUT"));'
                elif [ -f _config.ts ]; then
                  BINETTE_DOCS_OUT="$RUNNER_TEMP/site/docs/api/$branch" BINETTE_DOCS_BRANCH="$branch" deno task docs
                else
                  entries=(packages/core/src/index.ts packages/regie/src/index.ts packages/scene/src/index.ts packages/coulisses/src/index.ts)
                  [ ! -f packages/decor/src/index.ts ] || entries+=(packages/decor/src/index.ts)
                  [ ! -f packages/regie/src/build.ts ] || entries+=(packages/regie/src/build.ts)
                  [ ! -f packages/regie/src/cli.ts ] || entries+=(packages/regie/src/cli.ts)
                  deno doc --html --name=Binette --output="$RUNNER_TEMP/site/docs/api/$branch" "${entries[@]}"
                fi
              )
            fi
            label="${branch} の API"
            [ "$branch" = main ] && label="main（リリース版）の API"
            doc_links="$doc_links<li><a href=\"./api/${branch}/\">${label}</a></li>"
          done
          mkdir -p "$RUNNER_TEMP/site/docs"
          cat > "$RUNNER_TEMP/site/docs/index.html" <<HTML
          <!doctype html>
          <html lang="ja">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Binette ドキュメント</title>
          <style>
          :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
          body { max-width: 40rem; margin: 0 auto; padding: 2rem 1rem; line-height: 1.6; }
          li { margin: .5rem 0; }
          a { display: inline-block; min-height: 44px; line-height: 44px; }
          </style>
          </head>
          <body>
          <h1>Binette ドキュメント</h1>
          <p>ブランチごとの API ドキュメントです。</p>
          <ul>$doc_links</ul>
          <p><a href="../">トップへ</a> · <a href="https://github.com/nozomi-hiragi/binette">GitHub</a></p>
          </body>
          </html>
          HTML
          landing_branch=""
          if [ -d "$RUNNER_TEMP/src/main/landing" ]; then
            landing_branch="main"
          else
            for d in $(ls -d "$RUNNER_TEMP"/src/v*/landing 2>/dev/null | sort -V); do
              landing_branch=$(basename "$(dirname "$d")")
            done
          fi
          if [ -n "$landing_branch" ]; then
            cp -R "$RUNNER_TEMP/src/$landing_branch/landing/"* "$RUNNER_TEMP/site/"
            version="v$(jq -r .version "$RUNNER_TEMP/src/$landing_branch/packages/core/deno.json")"
            deno eval '
              const file = Deno.args[0];
              const ver = Deno.args[1];
              let content = Deno.readTextFileSync(file);
              content = content.replaceAll("{{version}}", ver);
              Deno.writeTextFileSync(file, content);
            ' "$RUNNER_TEMP/site/index.html" "$version"
          else
            echo "::warning::landing/ が見つかりませんでした。紹介ページは配置しません。"
          fi
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
