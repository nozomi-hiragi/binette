# main への push で、まだタグの無いバージョンなら JSR に公開し、タグと GitHub Release を作る。
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.7
      - name: Plan release
        id: plan
        run: |
          version="$(deno run --allow-read scripts/check-version.ts --print-version)"
          tag="v$version"
          release=true
          if [[ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]]; then
            release=false
            echo "Skipping $tag (tag already exists on origin)"
          fi
          {
            echo "release=$release"
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

  publish:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: npm-jsr
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.7
      - run: deno task check
      - run: deno task test
      - run: deno task check-pack
      - run: deno publish --dry-run --no-check
      - name: Verify release tag
        run: deno run --allow-read scripts/check-version.ts "$RELEASE_TAG"
      - name: Prepare release notes
        run: deno run --allow-read --allow-write scripts/changelog.ts "$RELEASE_VERSION" "$RUNNER_TEMP/release-notes.md"
      - name: Publish workspace packages (including Décor)
        run: deno publish --no-check

  release:
    needs: [plan, publish]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    # リポジトリに書き込むのはこのジョブだけ。依存は入れない
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.7
      - name: Prepare release notes
        run: deno run --allow-read --allow-write scripts/changelog.ts "$RELEASE_VERSION" "$RUNNER_TEMP/release-notes.md"
      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remote_tags="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          if [[ -n "$remote_tags" ]]; then
            tag_commit="$(awk 'NR == 1 { commit = $1 } /\^\{\}$/ { commit = $1 } END { print commit }' <<< "$remote_tags")"
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "Tag $RELEASE_TAG points to $tag_commit, expected $GITHUB_SHA" >&2
              exit 1
            fi
          fi
          releases="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name')"
          if grep -Fxq -- "$RELEASE_TAG" <<< "$releases"; then
            echo "Skipping $RELEASE_TAG (GitHub Release already exists)"
            exit 0
          fi
          args=("$RELEASE_TAG" --target "$GITHUB_SHA" --title "v$RELEASE_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md")
          if [[ "${RELEASE_VERSION%%.*}" == 0 ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
