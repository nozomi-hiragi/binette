name: CI

# Runs only on pull requests into main or v*. A push after merging would repeat the same checks,
# and releases are re-checked by publish.yml before publishing. PRs into other branches
# (e.g. a branch collecting small fixes) skip CI; the PR that brings them into v* runs it once.
on:
  pull_request:
    branches: [main, "v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.7
      - run: deno task check
      - run: deno task test
      - run: deno task check-pack
      - run: deno run -A scripts/publish.ts --dry-run
