<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Binette</title>
  <meta name="theme-color" content="#f3f5f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181c" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <style>
    :root {
      color-scheme: light;
      --color-base-100: #ffffff;
      --color-base-200: #f3f5f8;
      --color-base-300: #d5dae1;
      --color-base-content: #16181d;
      /* アクセント色は番号（data-accent）で選ぶ。ライト用とダーク用の組で持つ */
      --accent-light: #3273b9;
      --accent-dark: #5b9be0;
      --color-primary: var(--accent-light);
      --color-primary-content: #ffffff;
      --color-error: #c4352b;
      --color-success: #2e7d4f;
      --radius-box: 16px;
      --radius-field: 10px;
    }
    :root[data-accent="1"] { --accent-light: #2e7d4f; --accent-dark: #5fb98a; }
    :root[data-accent="2"] { --accent-light: #6b4fbb; --accent-dark: #a08be6; }
    :root[data-accent="3"] { --accent-light: #b83a6f; --accent-dark: #e585ad; }
    :root[data-accent="4"] { --accent-light: #b55a14; --accent-dark: #e59a52; }
    :root[data-accent="5"] { --accent-light: #4b5563; --accent-dark: #a3acb9; }
    /* ダークでは面（base-100）を背景（base-200）より明るくして持ち上げる。設定が「OS に合わせる」の間（data-theme なし）は OS のライト／ダークに合わせる */
    :root[data-theme="dark"] {
      color-scheme: dark;
      --color-base-100: #22252b;
      --color-base-200: #16181c;
      --color-base-300: #353a43;
      --color-base-content: #f1f3f5;
      --color-primary: var(--accent-dark);
      --color-primary-content: #0d1117;
      --color-error: #ff8a80;
      --color-success: #7ec699;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --color-base-100: #22252b;
        --color-base-200: #16181c;
        --color-base-300: #353a43;
        --color-base-content: #f1f3f5;
        --color-primary: var(--accent-dark);
        --color-primary-content: #0d1117;
        --color-error: #ff8a80;
        --color-success: #7ec699;
      }
    }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body { font-family: "IBM Plex Sans JP", system-ui, sans-serif; background: var(--color-base-100); color: var(--color-base-content); }
    body { display: flex; flex-direction: column; height: 100dvh; }
    #app {
      flex: 1; display: flex; flex-direction: column; min-height: 0;
      --bina-ui-grid-background: var(--color-base-200);
      --bina-ui-button-background: var(--color-base-100);
      --bina-ui-button-border: var(--color-base-300);
      --bina-ui-button-radius: 12px;
      --bina-ui-focus: var(--color-primary);
      /* Décor の variant・tone・surface などが使う役割の色 */
      --bina-ui-accent: var(--color-primary);
      --bina-ui-accent-content: var(--color-primary-content);
      --bina-ui-accent-soft: color-mix(in srgb, var(--color-primary) 14%, var(--color-base-100));
      --bina-ui-accent-text: color-mix(in srgb, var(--color-primary) 80%, var(--color-base-content));
      --bina-ui-surface: var(--color-base-100);
      --bina-ui-sunken: var(--color-base-200);
      --bina-ui-subtle: color-mix(in srgb, var(--color-base-content) 6%, var(--color-base-100));
      --bina-ui-line: var(--color-base-300);
      --bina-ui-muted: color-mix(in srgb, var(--color-base-content) 62%, var(--color-base-100));
      --bina-ui-danger: var(--color-error);
      --bina-ui-success: var(--color-success);
      --bina-ui-shadow: 0 0 0 1px color-mix(in srgb, var(--color-base-content) 8%, transparent), 0 8px 24px rgb(0 0 0 / 8%);
      /* 設定の色見本と壁紙。番号は設定（accent・wallpaper）と同じ */
      --bina-accent-0: light-dark(#3273b9, #5b9be0);
      --bina-accent-1: light-dark(#2e7d4f, #5fb98a);
      --bina-accent-2: light-dark(#6b4fbb, #a08be6);
      --bina-accent-3: light-dark(#b83a6f, #e585ad);
      --bina-accent-4: light-dark(#b55a14, #e59a52);
      --bina-accent-5: light-dark(#4b5563, #a3acb9);
      --bina-wallpaper-0: var(--color-base-200);
      --bina-wallpaper-1: linear-gradient(160deg, color-mix(in srgb, #5b9be0 38%, var(--color-base-200)), color-mix(in srgb, #b9a2ee 30%, var(--color-base-200)));
      --bina-wallpaper-2: linear-gradient(160deg, color-mix(in srgb, #f0a35e 36%, var(--color-base-200)), color-mix(in srgb, #e585ad 34%, var(--color-base-200)));
      --bina-wallpaper-3: linear-gradient(160deg, color-mix(in srgb, #5fb98a 36%, var(--color-base-200)), color-mix(in srgb, #5b9be0 26%, var(--color-base-200)));
      --bina-wallpaper-4: linear-gradient(160deg, color-mix(in srgb, #a08be6 36%, var(--color-base-200)), color-mix(in srgb, #e585ad 26%, var(--color-base-200)));
      --bina-wallpaper-5: linear-gradient(160deg, color-mix(in srgb, #d8b47a 34%, var(--color-base-200)), color-mix(in srgb, #a3acb9 22%, var(--color-base-200)));
      --bina-shell-background: var(--color-base-200);
      --bina-shell-color: var(--color-base-content);
      --bina-shell-surface: var(--color-base-100);
      --bina-shell-border: var(--color-base-300);
      --bina-shell-focus: var(--color-primary);
    }
    /* 壁紙はホームの後ろに敷く。ホームのグリッドは透かす */
    :root[data-wallpaper="1"] #app { --bina-wallpaper: var(--bina-wallpaper-1); }
    :root[data-wallpaper="2"] #app { --bina-wallpaper: var(--bina-wallpaper-2); }
    :root[data-wallpaper="3"] #app { --bina-wallpaper: var(--bina-wallpaper-3); }
    :root[data-wallpaper="4"] #app { --bina-wallpaper: var(--bina-wallpaper-4); }
    :root[data-wallpaper="5"] #app { --bina-wallpaper: var(--bina-wallpaper-5); }
    :root:is([data-wallpaper="1"], [data-wallpaper="2"], [data-wallpaper="3"], [data-wallpaper="4"], [data-wallpaper="5"]) #app { --bina-ui-grid-background: transparent; }
    #app .bina-shell-app:not(.bina-shell-content) { background: var(--bina-wallpaper, none); }
    #app > [role="alert"] { padding: 16px; color: #b3261e; }
    /* 起動の前だけ見える。Scene と復旧画面は #app の中身を置き換える */
    @keyframes boot-fade {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
    .boot-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      user-select: none;
      /* 配色は :root の見た目（OS の設定か、前回の data-theme）に合わせる */
      --boot-color: var(--color-base-content);
      background: var(--color-base-200);
      color: var(--boot-color);
    }
    /* すぐ終わる起動でちらつかないよう、最初の 300ms は中身を出さない */
    .boot-body, .boot-note {
      opacity: 0;
      animation: boot-fade 0.15s ease-out 300ms forwards;
    }
    .boot-body {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .boot-icon {
      width: 72px;
      height: 72px;
      display: block;
    }
    .boot-title {
      margin-top: 16px;
      font-size: 20px;
      font-weight: 600;
      line-height: 1.2;
    }
    .boot-bar-track {
      margin-top: 28px;
      width: 180px;
      height: 4px;
      background: color-mix(in srgb, var(--boot-color) 12%, transparent);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }
    .boot-bar {
      height: 100%;
      background: var(--color-primary);
      border-radius: 2px;
    }
    .boot-screen:not(.boot-determinate) .boot-bar {
      position: absolute;
      width: 40%;
      animation: boot-indeterminate 1.4s ease-in-out infinite;
    }
    @keyframes boot-indeterminate {
      0% { left: -40%; }
      100% { left: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      .boot-screen:not(.boot-determinate) .boot-bar {
        animation: none;
        left: 0;
        width: 100%;
        opacity: 0.3;
      }
    }
    .boot-screen.boot-determinate .boot-bar {
      position: absolute;
      left: 0;
      top: 0;
      width: 0%;
      transition: width 0.1s linear;
    }
    .boot-status {
      margin-top: 10px;
      font-size: 12px;
      color: color-mix(in srgb, var(--boot-color) 62%, transparent);
      text-align: center;
      line-height: 1.4;
      min-height: 18px;
    }
    .boot-note {
      position: absolute;
      bottom: 28px;
      font-size: 12px;
      color: color-mix(in srgb, var(--boot-color) 62%, transparent);
      text-align: center;
    }
    .bina-shell-content { padding: 16px; }
    /* fill() を付けた Décor のアプリは、アプリの領域を端まで使う */
    .bina-shell-content:has(> .bina-ui-fill) { padding: 0; }
    /* 下の規則は document 方式のボタンと variant の無い Décor のボタンの見た目。variant・スイッチ・選択・選択肢（segmented・tabs）・field の面の中の Décor のボタンは Décor の見た目に任せる */
    .bina-shell-content button:not(:where([class*="bina-ui-variant-"], .bina-ui-toggle, .bina-ui-selected, .bina-ui-option, .bina-ui-menuItem, .bina-ui-surface-field > *)) { padding: 8px 16px; border: 1px solid var(--color-base-300); border-radius: var(--radius-field); background: var(--color-primary); color: var(--color-primary-content); cursor: pointer; }
    .bina-shell-content button:not(:where([class*="bina-ui-variant-"], .bina-ui-toggle, .bina-ui-selected, .bina-ui-option, .bina-ui-menuItem, .bina-ui-surface-field > *, .bina-ui-small)) { min-height: 44px; }
    .bina-shell-content button:not(:where([class*="bina-ui-variant-"], .bina-ui-toggle, .bina-ui-selected, .bina-ui-option, .bina-ui-menuItem, .bina-ui-surface-field > *, .bina-ui-mono, .bina-ui-small, .bina-ui-bold)) { font: inherit; }
    .bina-shell-content button:not(:where([class*="bina-ui-variant-"], .bina-ui-toggle, .bina-ui-selected, .bina-ui-option, .bina-ui-menuItem, .bina-ui-surface-field > *)):focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
  </style>
</head>
<body>
  <div id="app">
    <div class="boot-screen" role="status">
      <div class="boot-body">
        <svg class="boot-icon" viewBox="0 0 128 128" width="72" height="72" aria-hidden="true">
          <rect width="128" height="128" rx="28" fill="#3273b9"/>
          <path fill="#ffb300" d="M24 35v-8a5 5 0 0 1 5-5h70a5 5 0 0 1 5 5v8z"/>
          <path fill="#fff" fill-rule="evenodd" d="M24 35h38v20a19 19 0 0 1-38 0zm11 0v19a8 8 0 0 0 16 0v-19zM66 35h38v20a19 19 0 0 1-38 0zm11 0v19a8 8 0 0 0 16 0v-19z"/>
          <path fill="#ffb300" d="M64 69 42 90h44z"/>
          <ellipse cx="64" cy="90" rx="22" ry="5.5" fill="#ffb300"/>
          <rect x="24" y="101" width="80" height="5" rx="2.5" fill="#ffb300"/>
        </svg>
        <div class="boot-title">Binette</div>
        <div class="boot-bar-track" aria-hidden="true">
          <div class="boot-bar"></div>
        </div>
        <div class="boot-status"><span class="boot-stage">起動中</span><span class="boot-detail" aria-hidden="true"></span></div>
      </div>
      <div class="boot-note" aria-hidden="true" hidden>初回だけ時間がかかります</div>
    </div>
  </div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
