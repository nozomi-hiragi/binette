<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Binette</title>
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <style>
    :root {
      color-scheme: light;
      --color-base-100: #ffffff;
      --color-base-200: #f3f5f8;
      --color-base-300: #d5dae1;
      --color-base-content: #16181d;
      --color-primary: #3273b9;
      --color-primary-content: #ffffff;
      --color-error: #c4352b;
      --color-success: #2e7d4f;
      --radius-box: 16px;
      --radius-field: 10px;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --color-base-100: #0b0c0e;
      --color-base-200: #1a1c21;
      --color-base-300: #2e323a;
      --color-base-content: #f5f6f8;
      --color-primary: #3273b9;
      --color-primary-content: #ffffff;
      --color-error: #ff8a80;
      --color-success: #7ec699;
      --radius-box: 16px;
      --radius-field: 10px;
    }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body { font-family: "IBM Plex Sans JP", system-ui, sans-serif; background: var(--color-base-100); color: var(--color-base-content); }
    body { display: flex; flex-direction: column; height: 100dvh; }
    #app {
      flex: 1; display: flex; flex-direction: column; min-height: 0;
      --bina-ui-grid-background: var(--color-base-200);
      --bina-ui-button-background: var(--color-base-100);
      --bina-ui-button-border: var(--color-base-300);
      --bina-ui-button-radius: 12px;
      --bina-ui-focus: var(--color-primary);
      /* Décor の tone などが使う役割の色 */
      --bina-ui-accent: var(--color-primary);
      --bina-ui-accent-content: var(--color-primary-content);
      --bina-ui-accent-soft: color-mix(in srgb, var(--color-primary) 14%, var(--color-base-100));
      --bina-ui-accent-text: color-mix(in srgb, var(--color-primary) 80%, var(--color-base-content));
      --bina-ui-surface: var(--color-base-100);
      --bina-ui-sunken: var(--color-base-200);
      --bina-ui-subtle: color-mix(in srgb, var(--color-base-content) 6%, var(--color-base-100));
      --bina-ui-line: var(--color-base-300);
      --bina-ui-muted: color-mix(in srgb, var(--color-base-content) 62%, var(--color-base-100));
      --bina-ui-danger: var(--color-error);
      --bina-ui-success: var(--color-success);
      --bina-ui-shadow: 0 0 0 1px color-mix(in srgb, var(--color-base-content) 8%, transparent), 0 8px 24px rgb(0 0 0 / 8%);
      --bina-shell-background: var(--color-base-200);
      --bina-shell-color: var(--color-base-content);
      --bina-shell-surface: var(--color-base-100);
      --bina-shell-border: var(--color-base-300);
      --bina-shell-focus: var(--color-primary);
    }
    #app > [role="alert"] { padding: 16px; color: #b3261e; }
    .bina-shell-content { padding: 16px; }
    /* fill() を付けた Décor のアプリは、アプリの領域を端まで使う */
    .bina-shell-content:has(> .bina-ui-fill) { padding: 0; }
    /* 下の規則は document 方式のボタンと tone の無い Décor のボタンの見た目。tone・スイッチ・選択・field の中の Décor のボタンは Décor の見た目に任せる */
    .bina-shell-content button:not(:where([class*="bina-ui-tone-"], .bina-ui-toggle, .bina-ui-selected, .bina-ui-tone-field > *)) { padding: 8px 16px; border: 1px solid var(--color-base-300); border-radius: var(--radius-field); background: var(--color-primary); color: var(--color-primary-content); cursor: pointer; }
    .bina-shell-content button:not(:where([class*="bina-ui-tone-"], .bina-ui-toggle, .bina-ui-selected, .bina-ui-tone-field > *, .bina-ui-small)) { min-height: 44px; }
    .bina-shell-content button:not(:where([class*="bina-ui-tone-"], .bina-ui-toggle, .bina-ui-selected, .bina-ui-tone-field > *, .bina-ui-mono, .bina-ui-small, .bina-ui-bold)) { font: inherit; }
    .bina-shell-content button:not(:where([class*="bina-ui-tone-"], .bina-ui-toggle, .bina-ui-selected, .bina-ui-tone-field > *)):focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
