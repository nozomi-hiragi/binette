<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Binette</title>
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <style>
    :root {
      color-scheme: light;
      --color-base-100: #ffffff;
      --color-base-200: #f3f5f8;
      --color-base-300: #d5dae1;
      --color-base-content: #16181d;
      --color-primary: #3273b9;
      --color-primary-content: #ffffff;
      --radius-box: 16px;
      --radius-field: 10px;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --color-base-100: #0b0c0e;
      --color-base-200: #1a1c21;
      --color-base-300: #2e323a;
      --color-base-content: #f5f6f8;
      --color-primary: #3273b9;
      --color-primary-content: #ffffff;
      --radius-box: 16px;
      --radius-field: 10px;
    }
    html, body { margin: 0; min-height: 100%; }
    body { font-family: "IBM Plex Sans JP", system-ui, sans-serif; background: var(--color-base-100); color: var(--color-base-content); }
    body { display: flex; flex-direction: column; min-height: 100dvh; }
    #app {
      flex: 1; display: flex; flex-direction: column; min-height: 0;
      --bina-ui-grid-background: var(--color-base-200);
      --bina-ui-button-background: var(--color-base-100);
      --bina-ui-button-border: var(--color-base-300);
      --bina-ui-button-radius: 12px;
      --bina-ui-focus: var(--color-primary);
      --bina-shell-background: var(--color-base-200);
      --bina-shell-color: var(--color-base-content);
      --bina-shell-surface: var(--color-base-100);
      --bina-shell-border: var(--color-base-300);
      --bina-shell-focus: var(--color-primary);
    }
    #app > [role="alert"] { padding: 16px; color: #b3261e; }
    .bina-shell-content { padding: 16px; }
    .bina-shell-content button { min-height: 44px; padding: 8px 16px; border: 1px solid var(--color-base-300); border-radius: var(--radius-field); background: var(--color-primary); color: var(--color-primary-content); font: inherit; cursor: pointer; }
    .bina-shell-content button:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
